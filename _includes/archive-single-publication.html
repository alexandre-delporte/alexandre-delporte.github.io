<div class="pub-entry">
  {% if post.citation %}
    <p class="pub-citation">{{ post.citation }}</p>
  {% else %}
    <p class="pub-citation"><strong>{{ post.title }}</strong>. <em>{{ post.venue }}</em>, {{ post.date | date: "%Y" }}.</p>
  {% endif %}
  <div class="pub-links">
    {% if post.paperurl %}
      <a href="{{ post.paperurl }}" class="pub-link" target="_blank" rel="noopener">Paper ↗</a>
    {% endif %}
    {% if post.slidesurl %}
      <a href="{{ post.slidesurl }}" class="pub-link" target="_blank" rel="noopener">Slides ↗</a>
    {% endif %}
  </div>
</div>
